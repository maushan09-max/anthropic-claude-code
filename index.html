<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9b3fc4">
  <meta name="description" content="LifeOS — organise every aspect of your life: weekly & monthly to-dos, meal prep, shopping, health, finances, duty roster, travel and journal.">
  <title>LifeOS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="logo"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle class="f" cx="12" cy="12" r="3.2"/></svg></span><span class="brand-name">LifeOS</span></div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">Your data stays on this device.</div>
    </aside>
    <div class="scrim" data-action="closeNav"></div>
    <div class="main-wrap">
      <header class="topbar">
        <button class="icon-btn menu-btn" data-action="toggleNav" aria-label="Open menu"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
        <h1 id="page-title">Today</h1>
        <div class="topbar-actions" id="top-actions"></div>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
  <dialog id="modal"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="js/icons.js" defer></script>
  <script src="js/core.js" defer></script>
  <script src="js/planner.js" defer></script>
  <script src="js/life.js" defer></script>
  <script src="js/money.js" defer></script>
  <script src="js/travel.js" defer></script>
  <script src="js/more.js" defer></script>
  <script src="js/study.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
