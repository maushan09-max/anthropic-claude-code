<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="LifeOS — organise every aspect of your life: tasks, calendar, habits, goals, money, health, journal, notes and lists.">
  <title>LifeOS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="logo">◎</span> LifeOS</div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">Your data stays on this device.</div>
    </aside>
    <div class="scrim" data-action="closeNav"></div>
    <div class="main-wrap">
      <header class="topbar">
        <button class="icon-btn menu-btn" data-action="toggleNav" aria-label="Open menu">☰</button>
        <h1 id="page-title">Today</h1>
        <div class="topbar-actions" id="top-actions"></div>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
  <dialog id="modal"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
